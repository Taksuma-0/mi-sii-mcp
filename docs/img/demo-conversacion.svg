<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="Demo: el asistente responde cuánto se ha retenido en boletas de honorarios usando mi-sii-mcp (datos ficticios)">
  <defs>
    <filter id="sombra" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f2a44" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="960" height="600" fill="#eef3f8"/>
  <g font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
    <g filter="url(#sombra)">
      <rect x="40" y="32" width="880" height="536" rx="16" fill="#ffffff"/>
    </g>
    <rect x="40" y="32" width="880" height="48" rx="16" fill="#0f2a44"/>
    <rect x="40" y="64" width="880" height="16" fill="#0f2a44"/>
    <circle cx="70" cy="56" r="6" fill="#ff5f57"/><circle cx="90" cy="56" r="6" fill="#febc2e"/><circle cx="110" cy="56" r="6" fill="#28c840"/>
    <text x="480" y="61" text-anchor="middle" font-size="14" fill="#d6e4f2">Asistente + mi-sii-mcp</text>

    <!-- Pregunta -->
    <rect x="400" y="104" width="488" height="52" rx="14" fill="#1764b6"/>
    <text x="420" y="136" font-size="16" fill="#ffffff">¿Cuánto me han retenido este año en boletas?</text>

    <!-- Llamadas a herramientas -->
    <g font-family="ui-monospace,'Cascadia Code',Consolas,monospace" font-size="13" fill="#526278">
      <rect x="72" y="176" width="420" height="30" rx="8" fill="#f4f8fd" stroke="#dce7f3"/>
      <text x="86" y="196">⚙ mi-sii-mcp · renta_sincronizar (2027)</text>
      <rect x="72" y="214" width="420" height="30" rx="8" fill="#f4f8fd" stroke="#dce7f3"/>
      <text x="86" y="234">⚙ mi-sii-mcp · renta_resumen</text>
    </g>

    <!-- Respuesta -->
    <text x="72" y="282" font-size="16" fill="#183047">En 2026 emitiste <tspan font-weight="700">12 boletas</tspan> por <tspan font-weight="700">$3.150.000</tspan> brutos;</text>
    <text x="72" y="306" font-size="16" fill="#183047">te retuvieron <tspan font-weight="700" fill="#16645e">$480.375</tspan> (15,25 %). Por pagador:</text>

    <g font-size="15">
      <rect x="72" y="326" width="816" height="38" fill="#f4f7fb"/>
      <text x="90" y="350" font-weight="700" fill="#183047">Pagador</text>
      <text x="640" y="350" text-anchor="end" font-weight="700" fill="#183047">Bruto</text>
      <text x="868" y="350" text-anchor="end" font-weight="700" fill="#183047">Retención</text>
      <g fill="#33485e">
        <text x="90" y="392">Constructora Ejemplo SpA</text><text x="640" y="392" text-anchor="end">$1.800.000</text><text x="868" y="392" text-anchor="end">$274.500</text>
        <line x1="72" y1="406" x2="888" y2="406" stroke="#e0e6ef"/>
        <text x="90" y="432">Universidad Demo</text><text x="640" y="432" text-anchor="end">$900.000</text><text x="868" y="432" text-anchor="end">$137.250</text>
        <line x1="72" y1="446" x2="888" y2="446" stroke="#e0e6ef"/>
        <text x="90" y="472">Comercial Demo SpA</text><text x="640" y="472" text-anchor="end">$450.000</text><text x="868" y="472" text-anchor="end">$68.625</text>
      </g>
    </g>

    <rect x="72" y="496" width="816" height="44" rx="10" fill="#e2f3ec" stroke="#c3e4d6"/>
    <text x="92" y="524" font-size="15" fill="#16645e"><tspan font-weight="700">✓ Cuadra</tspan> con lo que tus pagadores informaron al SII (DJ 1879).</text>
  </g>
  <text x="920" y="590" text-anchor="end" font-family="system-ui,sans-serif" font-size="11" fill="#7a8a9c">Datos ficticios</text>
</svg>
