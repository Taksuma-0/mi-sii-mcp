<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="mi-sii-mcp previsualizacion GitHub">
<title>mi-sii-mcp previsualizacion GitHub</title>

<rect width="1280" height="640" fill="#0f2a44"/>
<circle cx="1057" cy="-85" r="350" fill="#3dd6c3" opacity=".09"/>
<circle cx="-70" cy="650" r="330" fill="#7cb6fb" opacity=".09"/>
<g transform="translate(132 133) scale(1.42)"><g stroke-linecap="round" stroke-linejoin="round">
    <!-- antenna -->
    <path d="M90 39V28" fill="none" stroke="#e9f3fb" stroke-width="9"/>
    <circle cx="90" cy="22" r="9" fill="#7cb6fb"/>
    <!-- Speech bubble/chatbot, with pronounced tail -->
    <path d="M43 128V164L82 132" fill="#e9f3fb" stroke="#e9f3fb" stroke-width="7" />
    <rect x="23" y="45" width="125" height="101" rx="38" fill="#102c47" stroke="#e9f3fb" stroke-width="11"/>
    <!-- two matching rounded smiling-eye arches as in the original robot reference;
         both sit on the same baseline, curved at the crown, never pointed -->
    <path d="M59 90 C59 79 76 79 76 90" stroke="#7cb6fb" stroke-width="9" fill="none"/>
    <path d="M94 90 C94 79 111 79 111 90" stroke="#e9f3fb" stroke-width="9" fill="none"/>
    <!-- receipt/page in foreground -->
    <path d="M116 100H149Q157 100 157 109V149Q157 157 149 157H118Q109 157 109 148V109Q109 100 116 100Z" fill="#102c47" stroke="#e9f3fb" stroke-width="9"/>
    <!-- plug and prongs -->
    <path d="M158 127H171" stroke="#e9f3fb" stroke-width="8" fill="none"/>
    <rect x="170" y="116" width="13" height="23" rx="5" fill="#e9f3fb"/>
    <path d="M182 120H191M182 134H191" stroke="#e9f3fb" stroke-width="7" fill="none"/>
    <!-- blue text lines -->
    <path d="M119 117H142M119 130H133" stroke="#7cb6fb" stroke-width="6.8" fill="none"/>
    <!-- completed/check mark -->
    <path d="M123 143L131 150L145 135" stroke="#3dd6c3" stroke-width="8" fill="none"/>
    </g></g>
<g font-family="Inter Display, Inter, sans-serif" font-size="85" font-weight="900" letter-spacing="-3">
<text x="475" y="334" fill="white">mi-sii-</text>
<text x="748.08" y="334" fill="#3dd6c3">mcp</text></g>
<text x="478" y="393" fill="#bdd2df" font-family="Inter, sans-serif" font-size="23" letter-spacing="0.4">Conecta tus datos tributarios con IA</text>
<text x="479" y="475" fill="#3dd6c3" font-family="Inter, sans-serif" font-size="17" font-weight="700" letter-spacing="1.3">OPEN SOURCE  •  PROYECTO INDEPENDIENTE</text>

</svg>