name: Pruebas

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: [24]
        include:
          # La versión mínima que declara package.json (engines).
          - os: ubuntu-latest
            node: 22
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # better-sqlite3 trae binarios precompilados para cada sistema: sin scripts no hace falta compilar nada.
      - name: Instalar dependencias
        run: npm ci --ignore-scripts
      # Vulnerabilidades altas o críticas en lo que se instala con el paquete (no en las herramientas de desarrollo).
      - name: Revisar dependencias de producción
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm audit --omit=dev --audit-level=high
      - name: Tipos
        run: npm run typecheck
      - name: Pruebas
        run: npm test
      - name: Compilar y probar el servidor MCP compilado
        run: |
          npm run build
          npm run probar:mcp
